name: Build FFCheat

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld curl git zip xz-utils fakeroot file

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Download iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          SDK_URL=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
            | grep "browser_download_url" \
            | grep -i "iPhoneOS" \
            | head -1 \
            | cut -d '"' -f 4)

          echo "SDK URL: $SDK_URL"

          if [ -z "$SDK_URL" ]; then
            echo "API não retornou URL — clonando repo"
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
            cp -r /tmp/theos-sdks/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          else
            curl -L --fail "$SDK_URL" -o sdk.tar.xz
            file sdk.tar.xz
            tar -xf sdk.tar.xz -C "$HOME/theos/sdks"
            rm sdk.tar.xz
          fi

          ls "$HOME/theos/sdks/"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make 2>&1

      - name: Locate dylib
        run: find .theos/obj -name "*.dylib" | tee dylib_path.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FFCheat
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
          retention-days: 7
