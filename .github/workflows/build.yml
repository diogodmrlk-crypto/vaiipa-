name: Build FFCheat

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld curl git zip xz-utils fakeroot

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Download iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -L "https://github.com/theos/sdks/releases/download/1700/iPhoneOS16.5.sdk.tar.xz" \
               -o sdk.tar.xz
          tar -xf sdk.tar.xz -C "$HOME/theos/sdks"
          rm sdk.tar.xz

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 2>&1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FFCheat
          path: |
            .theos/obj/FFCheat.dylib
            packages/*.deb
          if-no-files-found: warn
          retention-days: 7
