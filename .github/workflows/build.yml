name: Build FFCheat

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld curl git zip xz-utils fakeroot file

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Download iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          SDK="iPhoneOS16.5.sdk.tar.xz"

          curl -L --fail \
            "https://github.com/theos/sdks/releases/latest/download/$SDK" \
            -o sdk.tar.xz \
          || curl -L --fail \
            "https://github.com/nickchan9/theos-sdks/releases/download/v1/$SDK" \
            -o sdk.tar.xz

          file sdk.tar.xz | grep -q "XZ compressed" || { echo "SDK download falhou"; exit 1; }
          tar -xf sdk.tar.xz -C "$HOME/theos/sdks"
          rm sdk.tar.xz

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 2>&1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FFCheat
          path: |
            .theos/obj/FFCheat.dylib
            packages/*.deb
          if-no-files-found: warn
          retention-days: 7
